<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Jazz Bridge — 공연장 프로필</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
/* PHOTO HERO */
.venue-hero { position: relative; height: 260px; flex-shrink: 0; overflow: hidden; }
.hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.45); }
.hero-placeholder { position: absolute; inset: 0; background: linear-gradient(150deg, #0f2a3a 0%, #1a3a2a 40%, #1a1035 100%); display: flex; align-items: center; justify-content: center; }
.hero-gradient { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0.5) 65%, rgba(0,0,0,0.88) 100%); }
.hero-content { position: absolute; inset: 0; padding: 16px var(--px) 20px; display: flex; flex-direction: column; justify-content: space-between; }
.hero-top { display: flex; align-items: center; justify-content: space-between; padding-top: 44px; }
.hero-back { font-size: 13px; color: rgba(255,255,255,0.9); display: flex; align-items: center; gap: 5px; cursor: pointer; }
.hero-action-btn { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; }
.hero-bottom {}
.partner-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; background: rgba(29,158,117,0.25); border: 0.5px solid rgba(93,202,165,0.5); border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; color: #5DCAA5; margin-bottom: 8px; }
.venue-name { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 5px; text-shadow: 0 2px 10px rgba(0,0,0,0.4); }
.venue-addr { font-size: 13px; color: rgba(255,255,255,0.75); display: flex; align-items: center; gap: 4px; margin-bottom: 14px; }
.venue-stats { display: flex; gap: 8px; }
.vstat { flex: 1; background: rgba(255,255,255,0.12); border: 0.5px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 10px; text-align: center; }
.vstat-n { font-size: 17px; font-weight: 700; color: #fff; }
.vstat-l { font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 2px; }
/* 이하 기존 스타일 유지 */
.map-box { margin: 14px var(--px); height: 96px; background: var(--bg-secondary); border-radius: var(--radius-card); border: 0.5px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text-tertiary); font-size: 15px; flex-shrink: 0; }
.seg-tabs { display: flex; gap: 1px; margin: 0 var(--px) 12px; flex-shrink: 0; }
.seg-tab { flex: 1; padding: 11px; background: var(--bg-secondary); text-align: center; font-size: 15px; color: var(--text-secondary); cursor: pointer; }
.seg-tab:first-child { border-radius: 10px 4px 4px 10px; }
.seg-tab:last-child { border-radius: 4px 10px 10px 4px; }
.seg-tab.on { background: var(--brand-light); color: var(--brand-dark); font-weight: 600; }
</style>
</head>
<body>
<!-- STATUS BAR (사진 위 오버레이) -->
<div style="position:absolute;top:0;left:0;right:0;z-index:10;height:44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 8px;">
  <span style="font-size:15px;font-weight:600;color:#fff;">9:41</span>
  <div style="display:flex;gap:6px;align-items:center;color:#fff;font-size:13px;"><i class="ti ti-wifi"></i><i class="ti ti-battery"></i></div>
</div>

<div class="content">
  <!-- PHOTO HERO -->
  <div class="venue-hero">

    <!-- ★ 실제 사진 적용 시: hero-placeholder 삭제 후 아래 img 사용 -->
    <!-- <img class="hero-img" src="https://공연장사진URL.jpg" alt="블루문 재즈클럽"> -->

    <!-- 플레이스홀더 -->
    <div class="hero-placeholder">
      <svg width="100" height="80" viewBox="0 0 100 80" fill="none" opacity="0.18">
        <rect x="10" y="20" width="80" height="50" rx="4" fill="white"/>
        <rect x="20" y="10" width="60" height="14" rx="3" fill="white"/>
        <rect x="30" y="35" width="16" height="35" fill="#0f2a3a"/>
        <rect x="54" y="35" width="16" height="35" fill="#0f2a3a"/>
        <text x="50" y="8" text-anchor="middle" fill="white" font-size="8" font-family="sans-serif" opacity="0.7">공연장 사진 영역</text>
      </svg>
    </div>

    <div class="hero-gradient"></div>

    <div class="hero-content">
      <div class="hero-top">
        <div class="hero-back"><i class="ti ti-arrow-left" style="font-size:14px;"></i> 돌아가기</div>
        <div class="hero-action-btn"><i class="ti ti-share"></i></div>
      </div>
      <div class="hero-bottom">
        <div class="partner-badge"><i class="ti ti-check" style="font-size:12px;"></i> 파트너 공연장</div>
        <div class="venue-name">블루문 재즈클럽</div>
        <div class="venue-addr"><i class="ti ti-map-pin" style="font-size:13px;"></i> 서울 마포구 · 홍대입구역 도보 3분</div>
        <div class="venue-stats">
          <div class="vstat"><div class="vstat-n">~80</div><div class="vstat-l">수용 인원</div></div>
          <div class="vstat"><div class="vstat-n">월~토</div><div class="vstat-l">공연 요일</div></div>
          <div class="vstat"><div class="vstat-n">4.8</div><div class="vstat-l">평점</div></div>
        </div>
      </div>
    </div>

  </div>
  <div class="map-box">
    <i class="ti ti-map" style="font-size:22px;"></i>
    <span>지도 보기</span>
  </div>
  <div class="seg-tabs">
    <div class="seg-tab on">공연 일정</div>
    <div class="seg-tab">공연장 정보</div>
  </div>
  <div class="hr"></div>
  <div class="upcoming-row">
    <div class="upcoming-date">5/17</div>
    <div style="flex:1;min-width:0;"><div class="upcoming-name">Jamie Kim Trio</div><div class="upcoming-venue">20:00 · ₩20,000</div></div>
    <i class="ti ti-chevron-right" style="font-size:18px;color:var(--text-tertiary);"></i>
  </div>
  <div class="upcoming-row">
    <div class="upcoming-date">5/18</div>
    <div style="flex:1;min-width:0;"><div class="upcoming-name">Seoul Jazz Collective</div><div class="upcoming-venue">19:00 · ₩18,000</div></div>
    <i class="ti ti-chevron-right" style="font-size:18px;color:var(--text-tertiary);"></i>
  </div>
  <div class="upcoming-row">
    <div class="upcoming-date">5/20</div>
    <div style="flex:1;min-width:0;"><div class="upcoming-name">Park Minjun Solo</div><div class="upcoming-venue">21:00 · 무료</div></div>
    <i class="ti ti-chevron-right" style="font-size:18px;color:var(--text-tertiary);"></i>
  </div>
</div>
<div class="navbar">
  <div class="nav-item"><i class="ti ti-home"></i>홈</div>
  <div class="nav-item active"><i class="ti ti-search"></i>검색</div>
  <div class="nav-item"><i class="ti ti-calendar"></i>캘린더</div>
  <div class="nav-item"><i class="ti ti-heart"></i>팔로우</div>
  <div class="nav-item"><i class="ti ti-user"></i>마이</div>
</div>
</body>
</html>
