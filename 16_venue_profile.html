<style>
/* PHOTO HERO */
.venue-hero { position: relative; height: 260px; flex-shrink: 0; overflow: hidden; }
.hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.45); }
.hero-placeholder { position: absolute; inset: 0; background: linear-gradient(150deg, #0f2a3a 0%, #1a3a2a 40%, #1a1035 100%); display: flex; align-items: center; justify-content: center; }
.hero-gradient { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0.5) 65%, rgba(0,0,0,0.88) 100%); }
.hero-content { position: absolute; inset: 0; padding: 16px var(--px) 20px; display: flex; flex-direction: column; justify-content: space-between; }
.hero-top { display: flex; align-items: center; justify-content: space-between; padding-top: 44px; }
.hero-back { font-size: 13px; color: rgba(255,255,255,0.9); display: flex; align-items: center; gap: 5px; cursor: pointer; }
.hero-action-btn { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; }
.hero-bottom {}
.partner-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; background: rgba(29,158,117,0.25); border: 0.5px solid rgba(93,202,165,0.5); border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; color: #5DCAA5; margin-bottom: 8px; }
.venue-name { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 5px; text-shadow: 0 2px 10px rgba(0,0,0,0.4); }
.venue-addr { font-size: 13px; color: rgba(255,255,255,0.75); display: flex; align-items: center; gap: 4px; margin-bottom: 14px; }
.venue-stats { display: flex; gap: 8px; }
.vstat { flex: 1; background: rgba(255,255,255,0.12); border: 0.5px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 10px; text-align: center; }
.vstat-n { font-size: 17px; font-weight: 700; color: #fff; }
.vstat-l { font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 2px; }
/* 이하 기존 스타일 유지 */
.map-box { margin: 14px var(--px); height: 96px; background: var(--bg-secondary); border-radius: var(--radius-card); border: 0.5px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text-tertiary); font-size: 15px; flex-shrink: 0; }
.seg-tabs { display: flex; gap: 1px; margin: 0 var(--px) 12px; flex-shrink: 0; }
.seg-tab { flex: 1; padding: 11px; background: var(--bg-secondary); text-align: center; font-size: 15px; color: var(--text-secondary); cursor: pointer; }
.seg-tab:first-child { border-radius: 10px 4px 4px 10px; }
.seg-tab:last-child { border-radius: 4px 10px 10px 4px; }
.seg-tab.on { background: rgba(0,71,171,0.15); color: var(--brand-dark); font-weight: 600; }
</style>
</head>
