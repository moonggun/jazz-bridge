<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Jazz Bridge — 공연장 프로필</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
/* HERO */
.venue-hero { position:relative; height:200px; flex-shrink:0; overflow:hidden; }
.hero-placeholder { position:absolute; inset:0; background:linear-gradient(160deg,#1a0a0a 0%,#3d1a0a 50%,#1a1005 100%); display:flex; align-items:center; justify-content:center; }
.hero-gradient { position:absolute; inset:0; background:linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0.7) 75%, rgba(0,0,0,0.95) 100%); }
.hero-content { position:absolute; inset:0; padding:16px var(--px) 16px; display:flex; flex-direction:column; justify-content:space-between; }
.hero-top { display:flex; align-items:center; justify-content:space-between; padding-top:44px; }
.hero-back { font-size:13px; color:rgba(255,255,255,0.9); display:flex; align-items:center; gap:5px; cursor:pointer; }
.hero-action-btn { width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center; font-size:16px; color:#fff; }
.venue-name { font-size:24px; font-weight:700; color:#fff; margin-bottom:4px; }
.venue-addr { font-size:13px; color:rgba(255,255,255,0.75); display:flex; align-items:center; gap:4px; }

/* STATS */
.stat-row { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 var(--px) 10px; flex-shrink:0; }
.stat-card { background:var(--bg-secondary); border-radius:var(--radius-card); padding:12px; text-align:center; border:0.5px solid var(--border); }
.stat-n { font-size:18px; font-weight:700; color:var(--text-primary); }
.stat-l { font-size:12px; color:var(--text-tertiary); margin-top:2px; }

/* MAP */
.map-wrap { margin:0 var(--px) 0; border-radius:var(--radius-card); overflow:hidden; height:200px; background:var(--bg-secondary); flex-shrink:0; position:relative; }
.map-placeholder { width:100%; height:100%; object-fit:cover; display:block; }
.map-img-ph { width:100%; height:100%; background: linear-gradient(135deg, #1a2a3a 0%, #2a3a4a 50%, #1a2a3a 100%); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.map-grid { position:absolute; inset:0; opacity:0.15; background-image: linear-gradient(rgba(255,255,255,0.3) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.3) 1px, transparent 1px); background-size: 30px 30px; }
.map-roads { position:absolute; inset:0; }
.map-pin-dot { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:16px; height:16px; border-radius:50%; background:#E24B4A; border:2.5px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,0.5); }
.map-label { position:absolute; top:50%; left:50%; transform:translate(8px, -24px); background:#fff; color:#151617; font-size:10px; font-weight:600; padding:2px 6px; border-radius:4px; white-space:nowrap; }

/* LIST */
.sec-divider { height:8px; background:var(--bg-secondary); flex-shrink:0; margin-top:10px; }
.upcoming-row { display:flex; align-items:center; gap:14px; padding:14px var(--px); border-bottom:0.5px solid var(--border); cursor:pointer; }
.upcoming-date { font-size:14px; font-weight:700; color:#0047AB; min-width:36px; flex-shrink:0; }
.upcoming-name { font-size:15px; font-weight:600; color:var(--text-primary); margin-bottom:2px; }
.upcoming-venue { font-size:13px; color:var(--text-secondary); }
</style>
</head>
<body>
<div class="statusbar" style="position:absolute;top:0;left:0;right:0;z-index:10;height:44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 8px;">
  <span style="font-size:15px;font-weight:600;color:#fff;">9:41</span>
  <div style="display:flex;gap:6px;align-items:center;color:#fff;font-size:13px;"><i class="ti ti-wifi"></i><i class="ti ti-battery"></i></div>
</div>

<div class="content">
  <!-- HERO -->
  <div class="venue-hero">
    <!-- ★ 실제 사진: <img style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" src="URL" alt="블루문 재즈클럽"> -->
    <div class="hero-placeholder">
      <i class="ti ti-building" style="font-size:64px;color:rgba(255,255,255,0.08);"></i>
    </div>
    <div class="hero-gradient"></div>
    <div class="hero-content">
      <div class="hero-top">
        <div class="hero-back"><i class="ti ti-arrow-left"></i> 돌아가기</div>
        <div class="hero-action-btn"><i class="ti ti-share"></i></div>
      </div>
      <div>
        <div class="venue-name">블루문 재즈클럽</div>
        <div class="venue-addr"><i class="ti ti-map-pin" style="font-size:13px;"></i> 서울 마포구 · 홍대입구역 도보 3분</div>
      </div>
    </div>
  </div>

  <!-- STATS -->
  <div class="stat-row">
    <div class="stat-card"><div class="stat-n">~ 80</div><div class="stat-l">수용 인원</div></div>
    <div class="stat-card"><div class="stat-n">월 ~ 토</div><div class="stat-l">공연 요일</div></div>
    <div class="stat-card"><div class="stat-n">4.8</div><div class="stat-l">평점</div></div>
  </div>

  <!-- MAP -->
  <div class="map-wrap">
    <div class="map-img-ph">
      <div class="map-grid"></div>
      <!-- 도로선 -->
      <svg style="position:absolute;inset:0;width:100%;height:100%;" viewBox="0 0 375 200" preserveAspectRatio="none">
        <line x1="0" y1="100" x2="375" y2="100" stroke="rgba(255,255,255,0.2)" stroke-width="8"/>
        <line x1="0" y1="60" x2="375" y2="80" stroke="rgba(255,255,255,0.15)" stroke-width="5"/>
        <line x1="0" y1="140" x2="375" y2="130" stroke="rgba(255,255,255,0.15)" stroke-width="5"/>
        <line x1="120" y1="0" x2="140" y2="200" stroke="rgba(255,255,255,0.2)" stroke-width="8"/>
        <line x1="240" y1="0" x2="250" y2="200" stroke="rgba(255,255,255,0.15)" stroke-width="5"/>
      </svg>
      <div class="map-pin-dot"></div>
      <div class="map-label">블루문 재즈클럽</div>
    </div>
  </div>

  <!-- 공연 목록 -->
  <div class="sec-divider"></div>
  <div class="upcoming-row">
    <div class="upcoming-date">5/17</div>
    <div style="flex:1;min-width:0;">
      <div class="upcoming-name">Jamie Kim Trio</div>
      <div class="upcoming-venue">20:00 · ₩20,000</div>
    </div>
    <i class="ti ti-chevron-right" style="color:var(--text-tertiary);"></i>
  </div>
  <div class="upcoming-row">
    <div class="upcoming-date">5/18</div>
    <div style="flex:1;min-width:0;">
      <div class="upcoming-name">Seoul Jazz Collective</div>
      <div class="upcoming-venue">19:00 · ₩18,000</div>
    </div>
    <i class="ti ti-chevron-right" style="color:var(--text-tertiary);"></i>
  </div>
  <div class="upcoming-row">
    <div class="upcoming-date">5/20</div>
    <div style="flex:1;min-width:0;">
      <div class="upcoming-name">Park Minjun Solo</div>
      <div class="upcoming-venue">21:00 · 무료</div>
    </div>
    <i class="ti ti-chevron-right" style="color:var(--text-tertiary);"></i>
  </div>
</div>

<div class="navbar">
  <div class="nav-item"><i class="ti ti-home"></i>홈</div>
  <div class="nav-item active"><i class="ti ti-search"></i>검색</div>
  <div class="nav-item"><i class="ti ti-calendar"></i>캘린더</div>
  <div class="nav-item"><i class="ti ti-heart"></i>팔로우</div>
  <div class="nav-item"><i class="ti ti-user"></i>마이</div>
</div>
</body>
</html>
