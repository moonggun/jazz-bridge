<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Jazz Bridge — 스플래시</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
body { overflow: hidden; }
.splash {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;

  background: linear-gradient(160deg, #0047AB 0%, #1a1a6e 50%, #6b2fa0 100%);

.statusbar { background: transparent; }
.sb-time { color: rgba(255,255,255,0.8); }
.sb-icons { color: rgba(255,255,255,0.8); }
.splash-icon { margin-bottom: 8px; }
.splash-title {
  font-size: 42px; font-weight: 700; color: #fff;
  text-align: center; line-height: 1.1; letter-spacing: -0.5px;
}
</style>
</head>
<body>
<div class="statusbar">
  <span class="sb-time">9:41</span>
  <div class="sb-icons"><i class="ti ti-wifi"></i><i class="ti ti-battery"></i></div>
</div>
<div class="splash">
  <div class="splash-icon">
    <svg width="72" height="52" viewBox="0 0 72 52" fill="none">
      <line x1="4"  y1="26" x2="4"  y2="26" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round"/>

      <line x1="52" y1="11" x2="52" y2="41" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="60" y1="19" x2="60" y2="33" stroke="rgba(255,255,255,0.65)" stroke-width="3" stroke-linecap="round"/>
      <line x1="68" y1="26" x2="68" y2="26" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="splash-title">Jazz<br>Bridge</div>
