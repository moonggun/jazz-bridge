<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Jazz Bridge — 스플래시</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
body { background: var(--brand-deep); }
.statusbar { background: var(--brand-deep); }
.sb-time { color: var(--brand-muted); }
.sb-icons { color: var(--brand-muted); }
.splash {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 28px; padding: 40px 32px;
  background: var(--brand-deep);
}
.splash-icon {
  width: 100px; height: 100px;
  background: var(--brand); border-radius: 28px;
  display: flex; align-items: center; justify-content: center;
}
.splash-title { font-size: 40px; font-weight: 700; color: #fff; letter-spacing: -.8px; text-align: center; line-height: 1.1; }
.splash-title span { color: var(--brand-mid); }
.splash-sub { font-size: 17px; color: var(--brand-muted); text-align: center; line-height: 1.7; }
.splash-dots { display: flex; gap: 8px; }
.sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); }
.sdot.on { background: var(--brand-mid); width: 22px; border-radius: 4px; }
</style>
</head>
<body>
<div class="statusbar dark">
  <span class="sb-time">9:41</span>
  <div class="sb-icons"><i class="ti ti-wifi"></i><i class="ti ti-battery"></i></div>
</div>
<div class="splash">
  <div class="splash-icon">
    <svg width="56" height="56" viewBox="0 0 64 64" fill="none">
      <path d="M10 42 Q32 18 54 42" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="10" y1="42" x2="10" y2="52" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="54" y1="42" x2="54" y2="52" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="32" cy="30" r="6" fill="#AFA9EC"/>
      <line x1="32" y1="36" x2="32" y2="52" stroke="#AFA9EC" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>
  <div>
    <div class="splash-title">Jazz<br><span>Bridge</span></div>
    <div class="splash-sub">전국 재즈 공연을<br>한 곳에서</div>
  </div>
  <div class="splash-dots">
    <div class="sdot on"></div>
    <div class="sdot"></div>
    <div class="sdot"></div>
  </div>
</div>
</body>
</html>
