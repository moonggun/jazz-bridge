<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Jazz Bridge — 스플래시</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
body { background: var(--brand-deep); }
.statusbar { background: var(--brand-deep); }
.sb-time { color: var(--brand-muted); }
.sb-icons { color: var(--brand-muted); }
.splash {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 28px; padding: 40px 32px;
  background: var(--brand-deep);
}
.splash-icon {
  width: 100px; height: 100px;
  background: var(--brand); border-radius: 28px;
  display: flex; align-items: center; justify-content: center;
}
.splash-title { font-size: 40px; font-weight: 700; color: #fff; letter-spacing: -.8px; text-align: center; line-height: 1.1; }
.splash-title span { color: var(--brand-mid); }
.splash-sub { font-size: 17px; color: var(--brand-muted); text-align: center; line-height: 1.7; }
.splash-dots { display: flex; gap: 8px; }
.sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); }
.sdot.on { background: var(--brand-mid); width: 22px; border-radius: 4px; }
</style>
</head>
<body>
<div class="statusbar dark">
  <span class="sb-time">9:41</span>
  <div class="sb-icons"><i class="ti ti-wifi"></i><i class="ti ti-battery"></i></div>
</div>
<div class="splash">
  <div class="splash-icon">
    <svg width="72" height="52" viewBox="0 0 72 52" fill="none" role="img" aria-label="Jazz Bridge 스플래시 아이콘">
      <line x1="4"  y1="26" x2="4"  y2="26" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round"/>
      <line x1="12" y1="19" x2="12" y2="33" stroke="rgba(255,255,255,0.65)" stroke-width="3" stroke-linecap="round"/>
      <line x1="20" y1="11" x2="20" y2="41" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="28" y1="5"  x2="28" y2="47" stroke="#AFA9EC" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="36" y1="2"  x2="36" y2="50" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <line x1="44" y1="5"  x2="44" y2="47" stroke="#AFA9EC" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="52" y1="11" x2="52" y2="41" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="60" y1="19" x2="60" y2="33" stroke="rgba(255,255,255,0.65)" stroke-width="3" stroke-linecap="round"/>
      <line x1="68" y1="26" x2="68" y2="26" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>
  <div>
    <div class="splash-title">Jazz<br><span>Bridge</span></div>
    <div class="splash-sub">전국 재즈 공연을<br>한 곳에서</div>
  </div>
  <div class="splash-dots">
    <div class="sdot on"></div>
    <div class="sdot"></div>
    <div class="sdot"></div>
  </div>
</div>
</body>
</html>
