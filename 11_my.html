<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Jazz Bridge — 마이</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
.profile-row{display:flex;align-items:center;gap:14px;padding:0 var(--px) 18px;}
.my-avatar{width:58px;height:58px;border-radius:50%;background:var(--brand-light);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--brand-dark);flex-shrink:0;}
.my-name{font-size:18px;font-weight:700;color:var(--text-primary);}
.my-meta{font-size:13px;color:var(--text-tertiary);margin-top:2px;}
.stat-row{display:flex;gap:1px;margin:0 var(--px) 18px;}
.stat{flex:1;background:var(--bg-secondary);padding:12px 8px;text-align:center;}
.stat:first-child{border-radius:12px 4px 4px 12px;}
.stat:last-child{border-radius:4px 12px 12px 4px;}
.stat-n{font-size:22px;font-weight:700;color:var(--text-primary);}
.stat-l{font-size:11px;color:var(--text-tertiary);margin-top:2px;}
.arch-row{display:flex;align-items:center;gap:10px;padding:13px var(--px);border-bottom:0.5px solid var(--border);}
.arch-dot{width:10px;height:10px;border-radius:50%;background:var(--brand-light);border:2px solid var(--brand);flex-shrink:0;}
.arch-title{font-size:14px;font-weight:500;color:var(--text-primary);}
.arch-venue{font-size:12px;color:var(--text-tertiary);margin-top:1px;}
.arch-date{margin-left:auto;font-size:12px;color:var(--text-tertiary);flex-shrink:0;}
.menu-row{display:flex;align-items:center;padding:16px var(--px);border-bottom:0.5px solid var(--border);cursor:pointer;}
.menu-row i.icon{font-size:20px;color:var(--text-secondary);margin-right:14px;}
.menu-label{font-size:16px;color:var(--text-primary);flex:1;}
.menu-row i.arrow{font-size:18px;color:var(--text-tertiary);}
</style>
</head>
<body>
<div class="statusbar">
  <span class="sb-time">9:41</span>
  <div class="sb-icons"><i class="ti ti-wifi"></i><i class="ti ti-battery"></i></div>
</div>

<div class="page-header-wrap">
  <div class="page-header-expanded">
    <div class="page-title-lg">마이</div>
    <div class="icon-btn"><i class="ti ti-settings"></i></div>
  </div>
  <div class="page-header-shrunk">
    <div class="page-title-sm">마이</div>
    <div class="icon-btn"><i class="ti ti-settings"></i></div>
  </div>
</div>

<div class="content">
  <div class="scroll-content">
    <div class="profile-row" style="padding-top:16px;">
      <div class="my-avatar">이재</div>
      <div><div class="my-name">이재윤</div><div class="my-meta">서울 · 가입 2025.03</div></div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="stat-n">24</div><div class="stat-l">본 공연</div></div>
      <div class="stat"><div class="stat-n">5</div><div class="stat-l">팔로우</div></div>
      <div class="stat"><div class="stat-n">3</div><div class="stat-l">예매</div></div>
    </div>
    <div class="sec-hd" style="padding-top:0;">최근 공연 기록</div>
    <div class="hr"></div>
    <div class="arch-row"><div class="arch-dot"></div><div style="flex:1;min-width:0;"><div class="arch-title">Jamie Kim Trio</div><div class="arch-venue">블루문 · 홍대</div></div><div class="arch-date">5/10</div></div>
    <div class="arch-row"><div class="arch-dot"></div><div style="flex:1;min-width:0;"><div class="arch-title">Seoul Jazz Collective</div><div class="arch-venue">클럽 에반스 · 홍대</div></div><div class="arch-date">5/3</div></div>
    <div class="arch-row"><div class="arch-dot"></div><div style="flex:1;min-width:0;"><div class="arch-title">Lee Soo Quartet</div><div class="arch-venue">올댓재즈 · 강남</div></div><div class="arch-date">4/26</div></div>
    <div class="hr" style="margin-top:8px;"></div>
    <div class="menu-row"><i class="ti ti-bell icon"></i><span class="menu-label">알림 설정</span><i class="ti ti-chevron-right arrow"></i></div>
    <div class="menu-row"><i class="ti ti-map-pin icon"></i><span class="menu-label">지역 설정</span><i class="ti ti-chevron-right arrow"></i></div>
    <div class="menu-row"><i class="ti ti-info-circle icon"></i><span class="menu-label">공연 제보하기</span><i class="ti ti-chevron-right arrow"></i></div>
  </div>
</div>

<div class="navbar">
  <div class="nav-item"><i class="ti ti-home"></i>홈</div>
  <div class="nav-item"><i class="ti ti-search"></i>검색</div>
  <div class="nav-item"><i class="ti ti-calendar"></i>캘린더</div>
  <div class="nav-item"><i class="ti ti-heart"></i>팔로우</div>
  <div class="nav-item active"><i class="ti ti-user"></i>마이</div>
</div>
<script>(function(){var s=document.querySelector('.scroll-content');var h=document.querySelector('.page-header-wrap');if(!s||!h)return;s.addEventListener('scroll',function(){h.classList.toggle('shrunk',s.scrollTop>10);},{passive:true});})();</script>
</body>
</html>
