<!DOCTYPE html>

<head>

<title>Jazz Bridge — 뮤지션 프로필</title>
<link rel="stylesheet" href="tokens.css">
<style>
/* PHOTO HERO */
.artist-hero { position: relative; height: 300px; flex-shrink: 0; overflow: hidden; }
.hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.5); }
.hero-placeholder { position: absolute; inset: 0; background: linear-gradient(160deg, #1a1035 0%, #2d1b69 50%, #0f2a3a 100%); display: flex; align-items: center; justify-content: center; }
.hero-gradient { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0.55) 65%, rgba(0,0,0,0.88) 100%); }
.hero-content { position: absolute; inset: 0; padding: 16px var(--px) 22px; display: flex; flex-direction: column; justify-content: space-between; }
.hero-top { display: flex; align-items: center; justify-content: space-between; padding-top: 44px; }
.hero-back { font-size: 13px; color: rgba(255,255,255,0.9); display: flex; align-items: center; gap: 5px; cursor: pointer; }
.hero-action-btn { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; }
/* 원형 프로필 아바타 (사진 없을 때 이니셜) */
.artist-av-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.artist-av { width: 72px; height: 72px; border-radius: 50%; background: rgba(0,71,171,0.7); border: 2.5px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: #fff; }
/* ★ 실제 사진 적용 시: artist-av 대신 img 사용
   .artist-av-img { width:72px; height:72px; border-radius:50%; object-fit:cover; border:2.5px solid rgba(255,255,255,0.3); } */
.artist-name { font-size: 22px; font-weight: 700; color: #fff; text-align: center; text-shadow: 0 2px 10px rgba(0,0,0,0.4); }
.artist-inst { font-size: 13px; color: rgba(255,255,255,0.7); text-align: center; }
.hero-bottom { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.artist-stats { display: flex; gap: 28px; }
.astat { text-align: center; }
.astat-n { font-size: 20px; font-weight: 700; color: #fff; }
.astat-l { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; }
.follow-btn { padding: 10px 36px; border-radius: var(--radius-pill); background: var(--brand); color: #fff; font-size: 14px; font-weight: 600; border: none; cursor: pointer; }
.follow-btn.following { background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.85); }
</style>
</head>
