<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Jazz Bridge — 뮤지션 프로필</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
/* HERO */
.artist-hero { position:relative; height:320px; flex-shrink:0; overflow:hidden; }
.hero-placeholder { position:absolute; inset:0; background:linear-gradient(160deg,#2d1a10 0%,#5c3317 60%,#3a2010 100%); }
.hero-gradient { position:absolute; inset:0; background:linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0.6) 65%, rgba(0,0,0,0.92) 100%); }
.hero-content { position:absolute; inset:0; padding:16px var(--px) 22px; display:flex; flex-direction:column; justify-content:space-between; }
.hero-top { display:flex; align-items:center; justify-content:space-between; padding-top:44px; }
.hero-back { font-size:13px; color:rgba(255,255,255,0.9); display:flex; align-items:center; gap:5px; cursor:pointer; }
.hero-action-btn { width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center; font-size:16px; color:#fff; }
.hero-bottom { display:flex; flex-direction:column; align-items:center; gap:12px; }
.artist-name { font-size:24px; font-weight:700; color:#fff; text-align:center; }
.artist-inst { font-size:13px; color:rgba(255,255,255,0.7); text-align:center; }
.artist-stats { display:flex; gap:28px; }
.astat { text-align:center; }
.astat-n { font-size:20px; font-weight:700; color:#fff; }
.astat-l { font-size:11px; color:rgba(255,255,255,0.5); margin-top:2px; }
.follow-btn { padding:10px 36px; border-radius:var(--radius-pill); background:#0047AB; color:#fff; font-size:14px; font-weight:600; border:none; cursor:pointer; }

/* LIST */
.upcoming-row { display:flex; align-items:center; gap:14px; padding:14px var(--px); border-bottom:0.5px solid var(--border); }
.upcoming-date { font-size:14px; font-weight:700; color:#0047AB; min-width:36px; flex-shrink:0; }
.upcoming-name { font-size:15px; font-weight:600; color:var(--text-primary); margin-bottom:2px; }
.upcoming-venue { font-size:13px; color:var(--text-secondary); }
.sec-hd { font-size:11px; font-weight:600; color:var(--text-tertiary); letter-spacing:.06em; text-transform:uppercase; padding:14px var(--px) 8px; flex-shrink:0; }
.hr { height:0.5px; background:var(--border); flex-shrink:0; }
</style>
</head>
<body>
<div class="statusbar" style="position:absolute;top:0;left:0;right:0;z-index:10;height:44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 8px;">
  <span style="font-size:15px;font-weight:600;color:#fff;">9:41</span>
  <div style="display:flex;gap:6px;align-items:center;color:#fff;font-size:13px;"><i class="ti ti-wifi"></i><i class="ti ti-battery"></i></div>
</div>

<div class="content">
  <div class="artist-hero">
    <!-- ★ 실제 사진: <img style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" src="URL" alt="Jamie Kim"> -->
    <div class="hero-placeholder"></div>
    <div class="hero-gradient"></div>
    <div class="hero-content">
      <div class="hero-top">
        <div class="hero-back"><i class="ti ti-arrow-left"></i> 돌아가기</div>
        <div class="hero-action-btn"><i class="ti ti-share"></i></div>
      </div>
      <div class="hero-bottom">
        <div class="artist-name">Jamie Kim</div>
        <div class="artist-inst">피아노 · 모던 재즈</div>
        <div class="artist-stats">
          <div class="astat"><div class="astat-n">128</div><div class="astat-l">팔로워</div></div>
          <div class="astat"><div class="astat-n">34</div><div class="astat-l">공연</div></div>
          <div class="astat"><div class="astat-n">12</div><div class="astat-l">클럽</div></div>
        </div>
        <button class="follow-btn">팔로우 중</button>
      </div>
    </div>
  </div>

  <div class="sec-hd">다가오는 공연</div>
  <div class="hr"></div>
  <div class="upcoming-row">
    <div class="upcoming-date">5/17</div>
    <div style="flex:1;min-width:0;"><div class="upcoming-name">Jamie Kim Trio</div><div class="upcoming-venue">블루문 · 홍대 · 20:00</div></div>
    <i class="ti ti-chevron-right" style="color:var(--text-tertiary);"></i>
  </div>
  <div class="upcoming-row">
    <div class="upcoming-date">5/24</div>
    <div style="flex:1;min-width:0;"><div class="upcoming-name">Jamie Kim & Soo Lee</div><div class="upcoming-venue">올댓재즈 · 강남 · 21:00</div></div>
    <i class="ti ti-chevron-right" style="color:var(--text-tertiary);"></i>
  </div>
  <div class="upcoming-row">
    <div class="upcoming-date">6/1</div>
    <div style="flex:1;min-width:0;"><div class="upcoming-name">Seoul Jazz Collective</div><div class="upcoming-venue">클럽 에반스 · 19:30</div></div>
    <i class="ti ti-chevron-right" style="color:var(--text-tertiary);"></i>
  </div>
</div>

<div class="navbar">
  <div class="nav-item"><i class="ti ti-home"></i>홈</div>
  <div class="nav-item"><i class="ti ti-search"></i>검색</div>
  <div class="nav-item"><i class="ti ti-calendar"></i>캘린더</div>
  <div class="nav-item active"><i class="ti ti-heart"></i>팔로우</div>
  <div class="nav-item"><i class="ti ti-user"></i>마이</div>
</div>
</body>
</html>
