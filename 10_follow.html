<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Jazz Bridge — 팔로우</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
.arow{display:flex;align-items:center;gap:12px;padding:14px var(--px);border-bottom:0.5px solid var(--border);}
.aav{width:44px;height:44px;border-radius:50%;background:#FAECE7;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#712B13;flex-shrink:0;}
.aav.teal{background:var(--teal-light);color:#085041;}
.aname{font-size:15px;font-weight:600;color:var(--text-primary);}
.ainst{font-size:13px;color:var(--text-tertiary);}
.anext{margin-left:auto;text-align:right;flex-shrink:0;}
.anext-date{font-size:13px;font-weight:600;color:var(--brand);}
.anext-venue{font-size:11px;color:var(--text-tertiary);margin-top:1px;}
.fbtn{width:28px;height:28px;border-radius:50%;border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:10px;}
.fbtn.on{background:var(--brand-light);border-color:var(--brand-mid);}
.fbtn.on i{color:var(--brand);}
</style>
</head>
<body>
<div class="statusbar">
  <span class="sb-time">9:41</span>
  <div class="sb-icons"><i class="ti ti-wifi"></i><i class="ti ti-battery"></i></div>
</div>

<div class="page-header-wrap">
  <div class="page-header-expanded">
    <div class="page-title-lg">팔로우</div>
    <div class="icon-btn"><i class="ti ti-plus"></i></div>
  </div>
  <div class="page-header-shrunk">
    <div class="page-title-sm">팔로우</div>
    <div class="icon-btn"><i class="ti ti-plus"></i></div>
  </div>
</div>

<div class="content">
  <div class="scroll-content">
    <div class="sec-hd" style="padding-top:8px;">팔로우 중 — 5명</div>
    <div class="hr"></div>
    <div class="arow"><div class="aav">JK</div><div style="flex:1;min-width:0;"><div class="aname">Jamie Kim</div><div class="ainst">피아노</div></div><div class="anext"><div class="anext-date">오늘</div><div class="anext-venue">블루문</div></div><div class="fbtn on"><i class="ti ti-bell" style="font-size:15px;"></i></div></div>
    <div class="arow"><div class="aav">SL</div><div style="flex:1;min-width:0;"><div class="aname">Soo Lee</div><div class="ainst">색소폰</div></div><div class="anext"><div class="anext-date">5/21 화</div><div class="anext-venue">올댓재즈</div></div><div class="fbtn on"><i class="ti ti-bell" style="font-size:15px;"></i></div></div>
    <div class="arow"><div class="aav">HK</div><div style="flex:1;min-width:0;"><div class="aname">Hyun-A Kim</div><div class="ainst">보컬</div></div><div class="anext"><div class="anext-date">5/18 토</div><div class="anext-venue">재즈바 369</div></div><div class="fbtn on"><i class="ti ti-bell" style="font-size:15px;"></i></div></div>
    <div class="arow"><div class="aav">MP</div><div style="flex:1;min-width:0;"><div class="aname">Min Park</div><div class="ainst">베이스</div></div><div class="anext"><div class="anext-date">예정 없음</div><div class="anext-venue">—</div></div><div class="fbtn on"><i class="ti ti-bell" style="font-size:15px;"></i></div></div>
    <div class="sec-hd" style="margin-top:6px;">추천 뮤지션</div>
    <div class="hr"></div>
    <div class="arow"><div class="aav teal">YC</div><div style="flex:1;min-width:0;"><div class="aname">Yuna Choi</div><div class="ainst">드럼</div></div><div class="fbtn" style="margin-left:auto;"><i class="ti ti-plus" style="font-size:15px;color:var(--text-secondary);"></i></div></div>
    <div class="arow"><div class="aav teal">DJ</div><div style="flex:1;min-width:0;"><div class="aname">David Jang</div><div class="ainst">트럼펫</div></div><div class="fbtn" style="margin-left:auto;"><i class="ti ti-plus" style="font-size:15px;color:var(--text-secondary);"></i></div></div>
  </div>
</div>

<div class="navbar">
  <div class="nav-item"><i class="ti ti-home"></i>홈</div>
  <div class="nav-item"><i class="ti ti-search"></i>검색</div>
  <div class="nav-item"><i class="ti ti-calendar"></i>캘린더</div>
  <div class="nav-item active"><i class="ti ti-heart"></i>팔로우</div>
  <div class="nav-item"><i class="ti ti-user"></i>마이</div>
</div>
<script>(function(){var s=document.querySelector('.scroll-content');var h=document.querySelector('.page-header-wrap');if(!s||!h)return;s.addEventListener('scroll',function(){h.classList.toggle('shrunk',s.scrollTop>10);},{passive:true});})();</script>
</body>
</html>
