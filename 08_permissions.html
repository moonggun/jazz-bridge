<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Jazz Bridge — 권한 요청</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
.perm-top { padding: 28px var(--px) 20px; text-align: center; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
.perm-app-icon { width: 64px; height: 64px; background: #0047AB; border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
.perm-title { font-size: 20px; font-weight: 700; color: var(--text-primary); line-height: 1.3; margin-bottom: 8px; }
.perm-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
.perm-body { flex: 1; padding: 20px var(--px) 0; display: flex; flex-direction: column; gap: 12px; }
.perm-item { display: flex; align-items: center; gap: 14px; padding: 16px; background: var(--bg-secondary); border-radius: var(--radius-card); border: 0.5px solid var(--border); }
.perm-item i { font-size: 22px; color: var(--brand); flex-shrink: 0; }
.perm-name { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
.perm-sub { font-size: 13px; color: var(--text-tertiary); }
.perm-footer { padding: 16px var(--px) 24px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
.btn-later { width: 100%; padding: 14px; background: transparent; color: var(--text-tertiary); border: none; font-size: 14px; text-align: center; cursor: pointer; }
</style>
</head>
<body>
<div class="statusbar">
  <span class="sb-time">9:41</span>
  <div class="sb-icons"><i class="ti ti-wifi"></i><i class="ti ti-battery"></i></div>
</div>
<div class="content">
  <div class="perm-top">
    <div class="perm-app-icon">
      <svg width="36" height="36" viewBox="0 0 64 64" fill="none" role="img" aria-label="Jazz Bridge 앱 아이콘">
  <rect width="36" height="36" rx="16" fill="#0047AB"/>
  <line x1="8"  y1="32" x2="8"  y2="32" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="24" x2="16" y2="40" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="16" x2="24" y2="48" stroke="#B8B8B8" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="12" x2="32" y2="52" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="40" y1="16" x2="40" y2="48" stroke="#B8B8B8" stroke-width="3" stroke-linecap="round"/>
  <line x1="48" y1="22" x2="48" y2="42" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <line x1="56" y1="28" x2="56" y2="36" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
</svg>
    </div>
    <div class="perm-title">Jazz Bridge가<br>알림을 보내도 될까요?</div>
    <div class="perm-desc">팔로우한 뮤지션 공연 등록 시,<br>예매 마감 임박 시 알려드려요</div>
  </div>
  <div class="perm-body">
    <div class="perm-item">
      <i class="ti ti-bell"></i>
      <div>
        <div class="perm-name">알림 (푸시)</div>
        <div class="perm-sub">공연 알림, 예매 확인 등</div>
      </div>
    </div>
    <div class="perm-item">
      <i class="ti ti-map-pin"></i>
      <div>
        <div class="perm-name">위치 (선택)</div>
        <div class="perm-sub">주변 공연장 추천에 사용</div>
      </div>
    </div>
  </div>
  <div class="perm-footer">
    <div class="btn-primary">허용하기</div>
    <div class="btn-later">나중에</div>
  </div>
</div>
</body>
</html>
