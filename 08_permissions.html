.perm-top { padding: 28px var(--px) 20px; text-align: center; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }

.perm-body { flex: 1; padding: 20px var(--px) 0; display: flex; flex-direction: column; gap: 12px; }

.perm-item i { font-size: 22px; color: var(--brand); flex-shrink: 0; }
.perm-name { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
.perm-sub { font-size: 13px; color: var(--text-tertiary); }
.perm-footer { padding: 16px var(--px) 24px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
.btn-later { width: 100%; padding: 14px; background: transparent; color: var(--text-tertiary); border: none; font-size: 14px; text-align: center; cursor: pointer; }
</style>
