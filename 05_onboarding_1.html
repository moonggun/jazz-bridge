<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Jazz Bridge — 온보딩 1</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
.ob-hero {
  background: var(--brand-deep);
  padding: 32px var(--px) 28px;
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  flex-shrink: 0;
}
.ob-prog { display: flex; gap: 6px; width: 100%; }
.ob-pd { height: 4px; flex: 1; border-radius: 2px; background: rgba(255,255,255,.2); }
.ob-pd.on { background: var(--brand-mid); }
.ob-icon-wrap {
  width: 76px; height: 76px; background: var(--brand);
  border-radius: 22px; display: flex; align-items: center; justify-content: center;
}
.ob-icon-wrap i { font-size: 36px; color: #fff; }
.ob-title { font-size: 22px; font-weight: 700; color: #fff; text-align: center; line-height: 1.3; }
.ob-desc { font-size: 15px; color: var(--brand-mid); text-align: center; line-height: 1.6; }
.ob-body { flex: 1; padding: 24px var(--px) 0; display: flex; flex-direction: column; gap: 18px; overflow: hidden; }
.ob-item { display: flex; align-items: flex-start; gap: 14px; }
.ob-bullet {
  width: 38px; height: 38px; border-radius: 11px;
  background: var(--brand-light); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.ob-bullet i { font-size: 20px; color: var(--brand); }
.ob-item-title { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; }
.ob-item-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.4; }
.ob-footer { padding: 20px var(--px) 24px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="statusbar dark">
  <span class="sb-time">9:41</span>
  <div class="sb-icons"><i class="ti ti-wifi"></i><i class="ti ti-battery"></i></div>
</div>
<div class="content">
  <div class="ob-hero">
    <div class="ob-prog"><div class="ob-pd on"></div><div class="ob-pd"></div><div class="ob-pd"></div></div>
    <div class="ob-icon-wrap"><i class="ti ti-map-pin"></i></div>
    <div>
      <div class="ob-title">SNS에 흩어진 공연,<br>이제 한 번에</div>
      <div class="ob-desc" style="margin-top:6px;">인스타·블로그에 올라온 재즈 공연을<br>자동으로 모아드려요</div>
    </div>
  </div>
  <div class="ob-body">
    <div class="ob-item">
      <div class="ob-bullet"><i class="ti ti-calendar"></i></div>
      <div><div class="ob-item-title">날짜별 공연 캘린더</div><div class="ob-item-desc">오늘, 이번 주 공연을 한눈에 확인</div></div>
    </div>
    <div class="ob-item">
      <div class="ob-bullet"><i class="ti ti-map-pin"></i></div>
      <div><div class="ob-item-title">지역별 필터</div><div class="ob-item-desc">홍대, 이태원, 강남 등 동네별 탐색</div></div>
    </div>
    <div class="ob-item">
      <div class="ob-bullet"><i class="ti ti-music"></i></div>
      <div><div class="ob-item-title">장르 & 규모 필터</div><div class="ob-item-desc">모던 재즈, 스윙, 보컬 등 취향대로</div></div>
    </div>
  </div>
  <div class="ob-footer">
    <div class="btn-primary">다음</div>
    <div class="btn-ghost">건너뛰기</div>
  </div>
</div>
</body>
</html>
