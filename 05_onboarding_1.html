<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Jazz Bridge — 온보딩 1</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
body { background: #151617; }
.ob-hero {
  background: #002d6e;
  padding: 32px 24px 36px;
  min-height: 340px;
  display: flex; flex-direction: column;
  align-items: center; gap: 20px;
  flex-shrink: 0; justify-content: center;
}
.ob-prog { display: flex; gap: 6px; width: 100%; align-self: flex-start; margin-top: -8px; }
.ob-pd { height: 4px; flex: 1; border-radius: 2px; background: rgba(255,255,255,.2); }
.ob-pd.on { background: rgba(255,255,255,.85); }
.ob-icon-wrap { width: 76px; height: 76px; display: flex; align-items: center; justify-content: center; }
.ob-title { font-size: 24px; font-weight: 700; color: #fff; text-align: center; line-height: 1.3; }
.ob-desc { font-size: 15px; color: rgba(255,255,255,.65); text-align: center; line-height: 1.7; }
.ob-body { flex: 1; padding: 24px 24px 0; display: flex; flex-direction: column; gap: 20px; }
.ob-item { display: flex; align-items: center; gap: 16px; }
.ob-bullet {
  width: 40px; height: 40px; border-radius: 11px;
  background: rgba(255,255,255,.06);
  border: 0.5px solid rgba(255,255,255,.1);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.ob-bullet svg { width: 20px; height: 20px; color: #888; }
.ob-item-title { font-size: 16px; font-weight: 600; color: #F0F0F0; margin-bottom: 3px; }
.ob-item-desc { font-size: 14px; color: #666; line-height: 1.4; }
.ob-footer { padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
.btn-primary { width: 100%; padding: 17px; background: #0047AB; border-radius: 14px; font-size: 17px; font-weight: 600; color: #fff; text-align: center; border: none; cursor: pointer; }
.btn-ghost { width: 100%; padding: 12px; font-size: 15px; color: #555; text-align: center; background: none; border: none; cursor: pointer; }
</style>
</head>
<body>
<div class="statusbar dark">
  <span class="sb-time">9:41</span>
  <div class="sb-icons"><i class="ti ti-wifi"></i><i class="ti ti-battery"></i></div>
</div>
<div class="content">
  <div class="ob-hero">
    <div class="ob-prog"><div class="ob-pd on"></div><div class="ob-pd"></div><div class="ob-pd"></div></div>
    <div class="ob-icon-wrap">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" role="img" aria-label="위치 아이콘">
        <path d="M24 4C15.716 4 9 10.716 9 19c0 10.5 15 27 15 27s15-16.5 15-27c0-8.284-6.716-15-15-15z" fill="#fff"/>
        <circle cx="24" cy="19" r="5.5" fill="#002d6e"/>
      </svg>
    </div>
    <div style="text-align:center;">
      <div class="ob-title">SNS에 흩어진 재즈 공연,<br>이제 한 곳에서</div>
      <div class="ob-desc" style="margin-top:10px;">인스타그램, 네이버 블로그, 클럽 홈페이지까지<br>전국 재즈 공연 정보를 자동으로 모아드려요</div>
    </div>
  </div>
  <div class="ob-body">
    <div class="ob-item">
      <div class="ob-bullet"><i class="ti ti-calendar"></i></div>
      <div><div class="ob-item-title">날짜별 공연 캘린더</div><div class="ob-item-desc">오늘, 이번 주 공연을 한눈에</div></div>
    </div>
    <div class="ob-item">
      <div class="ob-bullet"><i class="ti ti-map-pin"></i></div>
      <div><div class="ob-item-title">지역별 필터</div><div class="ob-item-desc">홍대, 이태원, 강남 탐색</div></div>
    </div>
    <div class="ob-item">
      <div class="ob-bullet"><i class="ti ti-music"></i></div>
      <div><div class="ob-item-title">장르 & 규모 필터</div><div class="ob-item-desc">취향에 맞는 공연 발견</div></div>
    </div>
  </div>
  <div class="ob-footer">
    <div class="btn-primary">다음</div>
    <div class="btn-ghost">건너뛰기</div>
  </div>
</div>
</body>
</html>
