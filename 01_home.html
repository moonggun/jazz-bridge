<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Jazz Bridge — 홈</title>
<style>
  /* ===== RESET ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ===== TOKENS ===== */
  :root {
    --brand:        #534AB7;
    --brand-dark:   #3C3489;
    --brand-deep:   #26215C;
    --brand-light:  #EEEDFE;
    --brand-mid:    #AFA9EC;
    --brand-muted:  #7F77DD;
    --teal:         #1D9E75;
    --text-primary:   #1A1A1A;
    --text-secondary: #5C5C5C;
    --text-tertiary:  #9B9B9B;
    --bg-primary:   #FFFFFF;
    --bg-secondary: #F5F5F3;
    --border:       rgba(0,0,0,0.1);
    --radius-card:  14px;
    --radius-pill:  99px;
    --px:           16px;
  }

  /* ===== BASE ===== */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", sans-serif;
    background: var(--bg-primary);
    width: 375px;
    height: 812px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ===== STATUS BAR ===== */
  .statusbar {
    height: 44px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 24px 8px;
    flex-shrink: 0;
    background: var(--bg-primary);
  }
  .sb-time { font-size: 15px; font-weight: 600; color: var(--text-primary); }
  .sb-icons { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--text-primary); }

  /* ===== CONTENT ===== */
  .content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

  /* ===== APP HEADER ===== */
  .app-header {
    padding: 16px var(--px) 12px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .app-name {
    font-size: 28px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.5px;
    line-height: 1.1;
  }
  .app-name span { color: var(--brand); }
  .app-loc {
    font-size: 13px;
    color: var(--text-tertiary);
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .header-icons { display: flex; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--bg-secondary);
    border: 0.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--text-secondary);
    cursor: pointer;
  }

  /* ===== PILL FILTER ===== */
  .pill-row {
    display: flex;
    gap: 8px;
    padding: 0 var(--px) 14px;
    overflow-x: auto;
    flex-shrink: 0;
  }
  .pill-row::-webkit-scrollbar { display: none; }
  .pill {
    padding: 7px 16px;
    border-radius: var(--radius-pill);
    font-size: 14px;
    font-weight: 500;
    border: 0.5px solid var(--border);
    color: var(--text-secondary);
    background: var(--bg-primary);
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
  }
  .pill.active {
    background: var(--brand-light);
    color: var(--brand-dark);
    border-color: var(--brand-mid);
  }

  /* ===== TONIGHT BANNER ===== */
  .tonight {
    margin: 0 var(--px) 14px;
    padding: 16px;
    background: var(--brand-light);
    border-radius: 16px;
    flex-shrink: 0;
  }
  .tonight-label { font-size: 12px; font-weight: 600; color: var(--brand); margin-bottom: 3px; }
  .tonight-num { font-size: 32px; font-weight: 700; color: var(--brand-deep); line-height: 1; }
  .tonight-sub { font-size: 12px; color: var(--brand-muted); margin-top: 4px; }

  /* ===== EVENT CARD ===== */
  .ecard {
    margin: 0 var(--px) 10px;
    padding: 14px 16px;
    background: var(--bg-primary);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-card);
    flex-shrink: 0;
  }
  .ecard.muted { background: var(--bg-secondary); }
  .ecard-time { font-size: 12px; color: var(--text-tertiary); margin-bottom: 3px; }
  .ecard-title { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; }
  .ecard-venue {
    font-size: 13px; color: var(--text-secondary);
    display: flex; align-items: center; gap: 4px;
  }
  .etags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .etag {
    font-size: 12px; padding: 3px 10px;
    border-radius: var(--radius-pill);
    background: var(--bg-secondary);
    color: var(--text-secondary);
  }

  /* ===== NAVBAR ===== */
  .navbar {
    height: 83px;
    border-top: 0.5px solid var(--border);
    display: flex;
    padding: 8px 0 0;
    flex-shrink: 0;
    background: var(--bg-primary);
  }
  .nav-item {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    font-size: 10px;
    color: var(--text-tertiary);
    padding-top: 4px;
    cursor: pointer;
  }
  .nav-item svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .nav-item.active { color: var(--brand); }
</style>
<!-- Tabler Icons CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>
