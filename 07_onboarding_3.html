<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Jazz Bridge — 온보딩 3</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
.ob-hero { background:#0047AB; padding:40px 24px 36px; min-height:320px; display:flex; flex-direction:column; align-items:center; gap:20px; flex-shrink:0; justify-content:center; }
.ob-prog { display:flex; gap:6px; width:100%; align-self:flex-start; margin-top:-8px; }
.ob-pd { height:3px; flex:1; border-radius:2px; background:rgba(255,255,255,.3); }
.ob-pd.on { background:#fff; }
.ob-icon-wrap { width:64px; height:64px; display:flex; align-items:center; justify-content:center; }
.ob-title { font-size:26px; font-weight:700; color:#fff; text-align:center; line-height:1.25; }
.ob-desc { font-size:15px; color:rgba(255,255,255,.75); text-align:center; line-height:1.7; margin-top:4px; }
.ob-body { flex:1; padding:20px 24px 0; display:flex; flex-direction:column; gap:14px; }
.genre-label { font-size:12px; font-weight:600; color:#888; letter-spacing:.06em; text-transform:uppercase; }
.chip-wrap { display:flex; flex-wrap:wrap; gap:8px; }
.pchip { padding:8px 18px; border-radius:99px; font-size:14px; font-weight:500; border:0.5px solid rgba(255,255,255,.1); color:#888; background:rgba(255,255,255,.05); cursor:pointer; }
.pchip.on { background:#0047AB; color:#fff; border-color:#0047AB; }
.loc-card { display:flex; align-items:center; gap:14px; padding:14px 16px; background:var(--bg-secondary); border-radius:14px; border:0.5px solid var(--border); cursor:pointer; }
.loc-card i { font-size:22px; color:#888; flex-shrink:0; }
.loc-name { font-size:15px; font-weight:500; color:#F0F0F0; }
.loc-sub { font-size:12px; color:#666; margin-top:2px; }
.ob-footer { padding:20px 24px 24px; flex-shrink:0; }
.btn-primary { width:100%; padding:17px; background:#0047AB; border-radius:14px; font-size:17px; font-weight:600; color:#fff; text-align:center; border:none; }
.statusbar { background:#0047AB; }
.sb-time { color:rgba(255,255,255,.8); }
.sb-icons { color:rgba(255,255,255,.8); }
</style>
</head>
<body>
<div class="statusbar">
  <span class="sb-time">9:41</span>
  <div class="sb-icons"><i class="ti ti-wifi"></i><i class="ti ti-battery"></i></div>
</div>
<div class="content">
  <div class="ob-hero">
    <div class="ob-prog"><div class="ob-pd"></div><div class="ob-pd"></div><div class="ob-pd on"></div></div>
    <div class="ob-icon-wrap">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <rect x="8" y="13" width="32" height="4.5" rx="2.25" fill="#fff"/>
        <rect x="8" y="23" width="32" height="4.5" rx="2.25" fill="#fff"/>
        <rect x="8" y="33" width="32" height="4.5" rx="2.25" fill="#fff"/>
        <circle cx="18" cy="15.25" r="4" fill="#0047AB"/>
        <circle cx="30" cy="25.25" r="4" fill="#0047AB"/>
        <circle cx="20" cy="35.25" r="4" fill="#0047AB"/>
      </svg>
    </div>
    <div style="text-align:center;">
      <div class="ob-title">딱 맞는 공연만<br>골라드릴게요</div>
      <div class="ob-desc">좋아하는 장르와 지역을 선택하면<br>취향에 꼭 맞는 공연을 추천해드려요</div>
    </div>
  </div>
  <div class="ob-body">
    <div class="genre-label">좋아하는 장르</div>
    <div class="chip-wrap">
      <div class="pchip on">모던 재즈</div>
      <div class="pchip on">스윙</div>
      <div class="pchip">보컬</div>
      <div class="pchip">퓨전</div>
      <div class="pchip on">프리 재즈</div>
    </div>
    <div class="genre-label" style="margin-top:4px;">주로 가는 지역</div>
    <div class="loc-card">
      <i class="ti ti-map-pin"></i>
      <div style="flex:1;"><div class="loc-name">서울 홍대 / 마포</div><div class="loc-sub">현재 위치 기반 자동 설정</div></div>
      <i class="ti ti-chevron-right" style="font-size:18px;color:#555;"></i>
    </div>
  </div>
  <div class="ob-footer">
    <div class="btn-primary">시작하기</div>
  </div>
</div>
</body>
</html>
